    { code: "N2", titulo: "COPA NINCO — N2 (LINEAL)" },
    { code: "N1", titulo: "COPA NINCO — N1 (TRANSVERSAL)" },
    { code: "N3", titulo: "COPA NINCO — N3 (S1600)" },
    { code: "INF", titulo: "CATEGORÍA INFANTIL (SCALEAUTO)" }
  ];

  const container = document.getElementById("nrs-standings-container");

  CATEGORIAS_INFO.forEach(catInfo => {
    const pilotosMap = {};

    PRUEBAS_NRS.forEach((prueba, rIdx) => {
      const enCat = prueba.resultados
        .filter(r => r.cat === catInfo.code)
        .sort((a, b) => a.total - b.total);

      enCat.forEach((entry, idx) => {
        if (!pilotosMap[entry.piloto]) {
          pilotosMap[entry.piloto] = {
            piloto: entry.piloto,
            club: entry.club,
            coche: entry.coche,
            pruebas: [null, null, null],
            totalPts: 0,
            mejorPuesto: 999
          };
        }
        if (entry.club && entry.club !== "-") pilotosMap[entry.piloto].club = entry.club;
        pilotosMap[entry.piloto].coche = entry.coche;

        const pts = entry.dnf ? 0 : (PUNTOS_SISTEMA[idx] || 0);
        if (!entry.dnf && (idx + 1) < pilotosMap[entry.piloto].mejorPuesto) {
          pilotosMap[entry.piloto].mejorPuesto = idx + 1;
        }

        pilotosMap[entry.piloto].pruebas[rIdx] = {
          pos: entry.dnf ? "Ab." : `${idx + 1}º`,
          pts: pts,
          tiempo: entry.total
        };
        pilotosMap[entry.piloto].totalPts += pts;
      });
    });

    const ranking = Object.values(pilotosMap).sort((a, b) => {
      if (b.totalPts !== a.totalPts) return b.totalPts - a.totalPts;
      return a.mejorPuesto - b.mejorPuesto;
    });

      <div class="nrs-reg-card-header">
        <h3 class="nrs-reg-card-title">
          <span class="nrs-num-badge">${catInfo.code}</span>
          ${catInfo.titulo}

        <table class="nrs-table">
          <thead>
            <tr>
              <th style="text-align:center;">Pos</th>
              <th>Piloto</th>
              <th>Club</th>
              <th>Último Coche</th>
              <th style="text-align:center;">1ª Prueba</th>
              <th style="text-align:center;">2ª Prueba</th>
              <th style="text-align:center;">3ª Prueba</th>
              <th style="text-align:right;">Total Puntos</th>
            </tr>

              const posClass = i === 0 ? "nrs-pos-1" : i === 1 ? "nrs-pos-2" : i === 2 ? "nrs-pos-3" : "";
              const formatR = (r) => r ? `<strong>${r.pts} pts</strong> <span style="opacity:0.7">(${r.pos})</span>` : "—";
              return `
                <tr>
                  <td class="nrs-pos ${posClass}">${i + 1}º</td>
                  <td><strong>${p.piloto}</strong></td>
                  <td><span class="nrs-club-tag">${p.club}</span></td>
                  <td style="color:#cbd5e1;">${p.coche}</td>
                  <td class="nrs-pts-cell">${formatR(p.pruebas[0])}</td>
                  <td class="nrs-pts-cell">${formatR(p.pruebas[1])}</td>
                  <td class="nrs-pts-cell">${formatR(p.pruebas[2])}</td>
                  <td class="nrs-total-pts">${p.totalPts} pts</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
